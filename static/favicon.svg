<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cutoutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Blade Stainless Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with 3D Bevel -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#cutoutBg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7.5" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Subtle Cutout Checker Pattern on Upper Left quadrant -->
  <rect x="4" y="4" width="3.5" height="3.5" fill="rgba(255,255,255,0.15)" rx="0.75"/>
  <rect x="7.5" y="7.5" width="3.5" height="3.5" fill="rgba(255,255,255,0.15)" rx="0.75"/>
  <rect x="4" y="11" width="3.5" height="3.5" fill="rgba(255,255,255,0.15)" rx="0.75"/>

  <!-- Dashed Precision Cutout Arc -->
  <path d="M5 18 C5 10, 10 5, 18 5" stroke="rgba(255,255,255,0.55)" stroke-width="1.3" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Left Blade Handle Loop -->
  <circle cx="10.5" cy="22" r="3" stroke="url(#bladeGrad)" stroke-width="2.2"/>
  <!-- Right Blade Handle Loop -->
  <circle cx="21.5" cy="22" r="3" stroke="url(#bladeGrad)" stroke-width="2.2"/>

  <!-- Left-to-Right Crossing Blade -->
  <path d="M12.5 19.5 L22.5 8" stroke="url(#bladeGrad)" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Right-to-Left Crossing Blade -->
  <path d="M19.5 19.5 L9.5 8" stroke="url(#bladeGrad)" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Central Pivot Rivet -->
  <circle cx="16" cy="14" r="1.8" fill="#4f46e5" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Golden 4-Point AI Sparkle Star -->
  <path d="M24.5 4.5 L25.5 7 L28 8 L25.5 9 L24.5 11.5 L23.5 9 L21 8 L23.5 7 Z" fill="#fde047" filter="url(#starGlow)"/>
  <circle cx="24.5" cy="8" r="0.8" fill="#ffffff"/>
</svg>
